; PlatformIO Project Configuration File for Minecraft Jukebox ESP32
; Sensor: TCS3000 / TCS3200 (S0, S1, S2, S3, OUT, VCC, GND, LED)
; Storage: LittleFS Internal Flash (Partisi 2.8MB, Tanpa MicroSD)
; Port: COM3

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Port otomatis ke COM3
upload_port = COM3
monitor_port = COM3

; Gunakan tabel partisi custom (2.8MB untuk file musik LittleFS)
board_build.partitions = partitions_custom.csv
board_build.filesystem = littlefs

board_build.f_cpu = 240000000L

build_flags = 
    -DCORE_DEBUG_LEVEL=1

lib_deps =
    ; Library Bluetooth Classic A2DP Source oleh Phil Schatzmann
    https://github.com/pschatzmann/ESP32-A2DP.git
    ; Library Helix MP3 Decoder
    https://github.com/pschatzmann/arduino-libhelix.git
    ; Filesystem bawaan ESP32 Core
    LittleFS
    FS
